<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Wild Roofing team tool for asking customers for honest Google reviews.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F1F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1319" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WR Reviews">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="site.webmanifest">
<title>Wild Roofing Review Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Gate: one centered card. Tokens are separate from the kit's so they never collide after unlock. */
:root{--g-bg:#F1F3F6;--g-surface:#FFFFFF;--g-ink:#16202A;--g-muted:#566271;--g-line:#D3DAE2;--g-field:#AEB8C4;--g-btn:#C81B26;--g-btn-ink:#FFFFFF;--g-err:#B3261E;--g-focus:#C81B26}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--g-bg:#0E1319;--g-surface:#151C24;--g-ink:#E6EBF1;--g-muted:#9BA7B5;--g-line:#2A3542;--g-field:#3D4A59;--g-btn:#C81B26;--g-btn-ink:#FFFFFF;--g-err:#FF8A80;--g-focus:#FF6B72;color-scheme:dark}}
:root[data-theme="dark"]{--g-bg:#0E1319;--g-surface:#151C24;--g-ink:#E6EBF1;--g-muted:#9BA7B5;--g-line:#2A3542;--g-field:#3D4A59;--g-btn:#C81B26;--g-btn-ink:#FFFFFF;--g-err:#FF8A80;--g-focus:#FF6B72;color-scheme:dark}
body{background:var(--g-bg);color:var(--g-ink);font:400 1rem/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;box-sizing:border-box}
.gate-card{width:100%;max-width:400px;box-sizing:border-box;display:grid;gap:18px;background:var(--g-surface);border:1px solid var(--g-line);border-radius:12px;padding:24px}
.gate.checking .gate-card>*:not(.gate-plate){visibility:hidden}
.gate-plate{justify-self:start;background:#FFFFFF;border:1px solid var(--g-line);border-radius:8px;padding:10px 12px;line-height:0}
.gate-plate img{display:block;width:min(260px,62vw);height:auto}
.gate-copy{display:grid;gap:4px}
.gate h1{margin:0;font:400 1.65rem/1.15 "Black Ops One",Impact,"Arial Black",sans-serif;letter-spacing:.01em}
.gate-copy p{margin:0;color:var(--g-muted)}
.gate-field{display:grid;gap:6px;font-size:.85rem;font-weight:600;color:var(--g-muted)}
.gate-field input{box-sizing:border-box;width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--g-field);border-radius:6px;background:var(--g-surface);color:var(--g-ink);font:400 1.05rem/1.4 "Public Sans",system-ui,sans-serif}
.gate-keep{display:flex;align-items:center;gap:10px;font-size:.92rem;min-height:32px}
.gate-keep input{width:20px;height:20px;accent-color:var(--g-btn);margin:0}
.gate-btn{min-height:50px;border:0;border-radius:6px;background:var(--g-btn);color:var(--g-btn-ink);font:600 1rem/1.2 "Public Sans",system-ui,sans-serif;cursor:pointer}
.gate-btn:hover{filter:brightness(1.08)}
.gate-btn:disabled{opacity:.6;cursor:progress}
.gate-err{margin:0;color:var(--g-err);font-weight:600;font-size:.92rem}
.gate :focus-visible{outline:2px solid var(--g-focus);outline-offset:2px}
</style>
</head>
<body>
<main class="gate checking" id="gate" aria-labelledby="gateTitle">
  <form class="gate-card" id="gateForm" novalidate>
    <div class="gate-plate"><img src="logo.png" alt="Wild Roofing LLC. Protection from the Wild Cat 5." width="421" height="77"></div>
    <div class="gate-copy">
      <h1 id="gateTitle">Review kit</h1>
      <p>Team only. Enter the password to open it.</p>
    </div>
    <label class="gate-field" for="gatePw"><span>Password</span>
      <input type="password" id="gatePw" name="password" autocomplete="current-password" autocapitalize="off" spellcheck="false">
    </label>
    <label class="gate-keep" for="gateKeep"><input type="checkbox" id="gateKeep" checked> Keep this device unlocked</label>
    <button type="submit" class="gate-btn" id="gateBtn">Open kit</button>
    <p class="gate-err" id="gateErr" role="alert" hidden></p>
    <noscript><p class="gate-err">Turn on JavaScript to open the kit.</p></noscript>
  </form>
</main>
<div id="kit-root"></div>

<script>
(function () {
  'use strict';
  var host = location.hostname;
  if (location.protocol === 'http:' && host !== 'localhost' && host !== '127.0.0.1') { location.replace('https:' + location.href.slice(5)); return; }
  var KEY_STORE = 'wr-kit-key-v1';
  var gate = document.getElementById('gate'), form = document.getElementById('gateForm'), pw = document.getElementById('gatePw'),
      keep = document.getElementById('gateKeep'), btn = document.getElementById('gateBtn'), err = document.getElementById('gateErr');
  var payload = null;
  try { payload = JSON.parse(document.getElementById('kit-payload').textContent); } catch (e) { payload = null; }
  var te = new TextEncoder(), td = new TextDecoder();
  function b64(u8) { var s = ''; for (var i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
  function unb64(str) { var s = atob(str), u8 = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i); return u8; }
  function saved(op, value) {
    try {
      if (op === 'get') return localStorage.getItem(KEY_STORE);
      if (op === 'set') localStorage.setItem(KEY_STORE, value); else localStorage.removeItem(KEY_STORE);
    } catch (e) { /* storage blocked: the password is asked for each visit */ }
    return null;
  }
  function say(msg) { err.textContent = msg || ''; err.hidden = !msg; }
  function ready() { gate.classList.remove('checking'); }
  var usable = !!(window.isSecureContext && window.crypto && crypto.subtle && payload && payload.ct && payload.kdf);

  function derive(password) {
    return crypto.subtle.importKey('raw', te.encode(password), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(payload.kdf.salt), iterations: payload.kdf.iter, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
    });
  }
  function openWith(key, env) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, key, unb64(env.ct)).then(function (buf) { return JSON.parse(td.decode(buf)); });
  }
  function sealWith(key, obj) {
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, te.encode(JSON.stringify(obj)))
      .then(function (buf) { return { v: 1, iv: b64(iv), ct: b64(new Uint8Array(buf)) }; });
  }
  function boot(key) {
    return openWith(key, payload).then(function (kit) {
      window.WRVault = Object.freeze({
        seal: function (obj) { return sealWith(key, obj); },
        open: function (env) { return openWith(key, env); },
        lock: function () { saved('del'); location.reload(); }
      });
      var style = document.createElement('style');
      style.textContent = kit.css;
      document.head.appendChild(style);
      document.getElementById('kit-root').innerHTML = kit.html;
      gate.remove();
      var script = document.createElement('script');
      script.textContent = kit.js;
      document.body.appendChild(script);
    });
  }
  function unlockSaved() {
    var raw = saved('get'), s = null;
    if (!raw) return Promise.resolve(false);
    try { s = JSON.parse(raw); } catch (e) { s = null; }
    if (!s || s.salt !== payload.kdf.salt || !s.k) { saved('del'); return Promise.resolve(false); }
    return crypto.subtle.importKey('raw', unb64(s.k), { name: 'AES-GCM' }, true, ['encrypt', 'decrypt'])
      .then(boot)
      .then(function () { return true; }, function () { saved('del'); return false; });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!usable) return;
    if (!pw.value) { say('Enter the password.'); pw.focus(); return; }
    say(''); btn.disabled = true; btn.textContent = 'Unlocking…';
    var key = null;
    derive(pw.value)
      .then(function (k) { key = k; return boot(k); })
      .then(function () {
        if (!keep.checked) return null;
        return crypto.subtle.exportKey('raw', key).then(function (raw) {
          saved('set', JSON.stringify({ salt: payload.kdf.salt, k: b64(new Uint8Array(raw)) }));
        });
      })
      .catch(function () {
        if (!document.getElementById('gate')) return;
        btn.disabled = false; btn.textContent = 'Open kit';
        say('Wrong password. Try again.');
        pw.select();
      });
  });

  if (!usable) {
    ready(); btn.disabled = true;
    say(window.isSecureContext === false ? 'Open this page with https:// to unlock it.' : 'This browser can’t unlock the kit. Use a current Safari or Chrome.');
    return;
  }
  unlockSaved().then(function (done) { if (!done) { ready(); pw.focus(); } });
})();
</script>
